import*as T from'three';import{OrbitControls}from'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';
const S=new T.Scene();S.background=new T.Color(0x111122);

const O=new OrbitControls(C,R.domElement);O.enableDamping=true;

G.rotation.x=-Math.PI/2;G.position.y=-.01;S.add(G);

const D=new T.DirectionalLight(0xffffff,.8);D.position.set(10,20,10);S.add(D);
fetch('slnecna_988_60.ply').then(r=>r.text()).then(t=>{
const l=t.trim().split('
');let vc=0,fc=0,vs=0;
for(let i=0;i<l.length;i++){if(l[i].includes('element vertex'))vc=+l[i].split(' ')[2];if(l[i].includes('element face'))fc=+l[i].split(' ')[2];if(l[i]==='end_header'){vs=i+1;break;}}
const g=new T.BufferGeometry();const v=new Float32Array(vc*3);
for(let i=0;i<vc;i++){const p=l[vs+i].split(' ').map(Number);v[i*3]=p[0];v[i*3+1]=p[2];v[i*3+2]=p[1];}

const idx=[];for(let i=0;i<fc;i++){const p=l[vs+vc+i].split(' ').map(Number);idx.push(p[1],p[2],p[3]);}

const pg=new T.BufferGeometry();pg.setAttribute('position',new T.BufferAttribute(v,3));

const bb=new T.Box3().setFromObject(m);const bc=bb.getCenter(new T.Vector3());const bs=bb.getSize(new T.Vector3());
C.position.set(bc.x+bs.x,bc.y+bs.y*1.2,bc.z+bs.z*1.2);O.target.copy(bc);O.update();
});
