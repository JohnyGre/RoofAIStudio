<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

const container = document.getElementById("container");
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

const camera = new THREE.PerspectiveCamera(50, container.clientWidth/container.clientHeight, 0.5, 200);
camera.position.set(30, 25, 20);
camera.lookAt(0, 0, 3);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(container.clientWidth, container.clientHeight);
labelRenderer.domElement.style.position = 'absolute';
labelRenderer.domElement.style.top = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
container.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 3);
controls.enableDamping = true;
controls.update();

// Lighting
scene.add(new THREE.AmbientLight(0x404070, 2));
const sun = new THREE.DirectionalLight(0xffffff, 3);
sun.position.set(30, 40, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
scene.add(sun);

// Grid
const grid = new THREE.GridHelper(60, 30, 0x333355, 0x1a1a3e);
scene.add(grid);

// PLANES DATA
const planes = [{"id": "O1", "type": "odkvap_obrys", "area_m2": 468.26, "pitch_deg": 0.0, "vertices": [[12.298, 4.56, 0.72], [6.4, 11.256, 0.72], [4.607, 13.162, 0.72], [4.183, 13.422, 0.72], [0.984, 12.745, 0.72], [-6.731, 10.664, 0.72], [-7.596, 10.278, 0.72], [-8.93, 9.254, 0.72], [-11.039, 7.415, 0.72], [-14.146, 4.627, 0.72], [-15.155, 3.6, 0.72], [-15.011, 3.241, 0.72], [-14.662, 2.743, 0.72], [-12.206, -0.109, 0.72], [-3.905, -9.466, 0.72], [1.098, -14.993, 0.72], [1.478, -15.132, 0.72], [2.758, -14.265, 0.72], [8.157, -9.514, 0.72], [9.026, -8.627, 0.72]], "edges": [{"id": "o1", "type": "o", "length_m": 8.923, "start": [12.298, 4.56, 0.72], "end": [6.4, 11.256, 0.72]}, {"id": "o2", "type": "o", "length_m": 2.617, "start": [6.4, 11.256, 0.72], "end": [4.607, 13.162, 0.72]}, {"id": "o3", "type": "o", "length_m": 0.497, "start": [4.607, 13.162, 0.72], "end": [4.183, 13.422, 0.72]}, {"id": "o4", "type": "o", "length_m": 3.27, "start": [4.183, 13.422, 0.72], "end": [0.984, 12.745, 0.72]}, {"id": "o5", "type": "o", "length_m": 7.991, "start": [0.984, 12.745, 0.72], "end": [-6.731, 10.664, 0.72]}, {"id": "o6", "type": "o", "length_m": 0.947, "start": [-6.731, 10.664, 0.72], "end": [-7.596, 10.278, 0.72]}, {"id": "o7", "type": "o", "length_m": 1.682, "start": [-7.596, 10.278, 0.72], "end": [-8.93, 9.254, 0.72]}, {"id": "o8", "type": "o", "length_m": 2.798, "start": [-8.93, 9.254, 0.72], "end": [-11.039, 7.415, 0.72]}, {"id": "o9", "type": "o", "length_m": 4.174, "start": [-11.039, 7.415, 0.72], "end": [-14.146, 4.627, 0.72]}, {"id": "o10", "type": "o", "length_m": 1.44, "start": [-14.146, 4.627, 0.72], "end": [-15.155, 3.6, 0.72]}, {"id": "o11", "type": "o", "length_m": 0.387, "start": [-15.155, 3.6, 0.72], "end": [-15.011, 3.241, 0.72]}, {"id": "o12", "type": "o", "length_m": 0.608, "start": [-15.011, 3.241, 0.72], "end": [-14.662, 2.743, 0.72]}, {"id": "o13", "type": "o", "length_m": 3.764, "start": [-14.662, 2.743, 0.72], "end": [-12.206, -0.109, 0.72]}, {"id": "o14", "type": "o", "length_m": 12.508, "start": [-12.206, -0.109, 0.72], "end": [-3.905, -9.466, 0.72]}, {"id": "o15", "type": "o", "length_m": 7.455, "start": [-3.905, -9.466, 0.72], "end": [1.098, -14.993, 0.72]}, {"id": "o16", "type": "o", "length_m": 0.405, "start": [1.098, -14.993, 0.72], "end": [1.478, -15.132, 0.72]}, {"id": "o17", "type": "o", "length_m": 1.546, "start": [1.478, -15.132, 0.72], "end": [2.758, -14.265, 0.72]}, {"id": "o18", "type": "o", "length_m": 7.192, "start": [2.758, -14.265, 0.72], "end": [8.157, -9.514, 0.72]}, {"id": "o19", "type": "o", "length_m": 1.242, "start": [8.157, -9.514, 0.72], "end": [9.026, -8.627, 0.72]}, {"id": "o20", "type": "o", "length_m": 13.587, "start": [9.026, -8.627, 0.72], "end": [12.298, 4.56, 0.72]}]}];

// Center all vertices
let allX = [], allY = [], allZ = [];
planes.forEach(p => p.vertices.forEach(v => { allX.push(v[0]); allY.push(v[1]); allZ.push(v[2]); }));
const cx = (Math.min(...allX) + Math.max(...allX)) / 2;
const cy = (Math.min(...allY) + Math.max(...allY)) / 2;
const cz = Math.min(...allZ);

// Render each plane
planes.forEach((plane, pi) => {
    const verts = plane.vertices;
    if (verts.length < 3) return;

    // Triangulate polygon (fan triangulation)
    const positions = [];
    for (let i = 1; i < verts.length - 1; i++) {
        positions.push(verts[0][0] - cx, verts[0][1] - cy, verts[0][2] - cz);
        positions.push(verts[i][0] - cx, verts[i][1] - cy, verts[i][2] - cz);
        positions.push(verts[i+1][0] - cx, verts[i+1][1] - cy, verts[i+1][2] - cz);
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
    geo.computeVertexNormals();

    // Semi-transparent face
    const hue = (pi * 50 + 30) % 360;
    const color = new THREE.Color().setHSL(hue/360, 0.5, 0.45);
    const mat = new THREE.MeshStandardMaterial({color, roughness:0.7, metalness:0.1, side:THREE.DoubleSide, transparent:true, opacity:0.75});
    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true;
    scene.add(mesh);

    // Wireframe outline
    const wireGeo = new THREE.BufferGeometry();
    const wireVerts = [];
    for (let i = 0; i < verts.length; i++) {
        const v1 = verts[i];
        const v2 = verts[(i+1) % verts.length];
        wireVerts.push(v1[0]-cx, v1[1]-cy, v1[2]-cz, v2[0]-cx, v2[1]-cy, v2[2]-cz);
    }
    wireGeo.setAttribute("position", new THREE.Float32BufferAttribute(wireVerts, 3));
    const wireMat = new THREE.LineBasicMaterial({color:0x000000, linewidth:1, transparent:true, opacity:0.3});
    scene.add(new THREE.LineSegments(wireGeo, wireMat));

    // Area label at centroid
    let cpx = 0, cpy = 0, cpz = 0;
    verts.forEach(v => { cpx += v[0]-cx; cpy += v[1]-cy; cpz += v[2]-cz; });
    cpx /= verts.length; cpy /= verts.length; cpz /= verts.length;
    
    const div = document.createElement("div");
    div.textContent = plane.id + "\n" + plane.area_m2.toFixed(1) + "m2";
    div.style.cssText = "color:#fff;font-size:10px;background:rgba(0,0,0,0.7);padding:2px 6px;border-radius:3px;pointer-events:auto;cursor:default";
    const label = new CSS2DObject(div);
    label.position.set(cpx, cpy, cpz);
    scene.add(label);

    // Edge lines with colors
    plane.edges.forEach(edge => {
        const ec = {"o": 16729156, "h": 4491519, "n": 4521796, "u": 16755200, "f": 8947848, "p": 11158783}[edge.type] || 0x888888;
        const geo2 = new THREE.BufferGeometry();
        geo2.setAttribute("position", new THREE.Float32BufferAttribute([
            edge.start[0]-cx, edge.start[1]-cy, edge.start[2]-cz,
            edge.end[0]-cx, edge.end[1]-cy, edge.end[2]-cz
        ], 3));
        const line = new THREE.Line(geo2, new THREE.LineBasicMaterial({color:ec, linewidth:2, transparent:true, opacity:0.9}));
        scene.add(line);

        // Small sphere at midpoint
        const mx = (edge.start[0] + edge.end[0])/2 - cx;
        const my = (edge.start[1] + edge.end[1])/2 - cy;
        const mz = (edge.start[2] + edge.end[2])/2 - cz;
        
        // Edge label
        const ediv = document.createElement("div");
        ediv.textContent = edge.id + " " + edge.length_m.toFixed(2) + "m";
        ediv.style.cssText = "color:#ccc;font-size:9px;background:rgba(0,0,0,0.8);padding:1px 4px;border-radius:2px;pointer-events:auto;cursor:default;border-left:2px solid #" + ec.toString(16).padStart(6,"0");
        const elabel = new CSS2DObject(ediv);
        elabel.position.set(mx, my, mz);
        scene.add(elabel);
    });
});

    requestAnimationFrame(animate);
