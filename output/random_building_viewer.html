<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>3D Strecha z LiDAR</title>
<style>
body { margin:0; background:#111; color:#eee; font-family:sans-serif; }
#info { position:absolute; top:16px; left:16px; background:rgba(0,0,0,.85); padding:16px; border-radius:8px; max-width:320px; }
#info h1 { margin:0 0 8px; font-size:16px; }
.s { display:inline-block; margin:2px 6px 2px 0; background:#222; padding:4px 10px; border-radius:4px; }
.sl { color:#888; font-size:11px; }
.sv { font-size:15px; font-weight:bold; }
</style></head><body>
<div id="info">
  <h1>3D Strecha z LiDAR bodov</h1>
  <div class="s"><div class="sl">Adresa (pribl.)</div><div class="sv">48.392232N, 17.590044E</div></div>
  <div class="s"><div class="sl">Pôdorys</div><div class="sv">8.3 x 19.6 m</div></div>
  <div class="s"><div class="sl">Výška strechy</div><div class="sv">5.1 m nad terénom</div></div>
  <div class="s"><div class="sl">Sklon</div><div class="sv">25.5 deg</div></div>
  <div class="s"><div class="sl">Plocha</div><div class="sv">69 m2</div></div>
  <div class="s"><div class="sl">LiDAR bodov</div><div class="sv">4,365</div></div>
  <p style="font-size:11px;color:#666;margin-top:8px">Zdroj: ZBGIS LLS .LAZ bodový oblak, 69m2, klasifikácia class=6</p>
</div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x111122);
const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,1000);
const ren=new THREE.WebGLRenderer({antialias:true}); ren.setSize(innerWidth,innerHeight); document.body.appendChild(ren.domElement);
const ctrl=new OrbitControls(cam,ren.domElement); ctrl.enableDamping=true;
scene.add(new THREE.GridHelper(50,25,0x333355,0x222244));
scene.add(Object.assign(new THREE.Mesh(new THREE.PlaneGeometry(50,50),new THREE.MeshStandardMaterial({color:0x222233})),{rotation:new THREE.Euler(-Math.PI/2,0,0),position:new THREE.Vector3(0,-0.01,0)}));
scene.add(new THREE.AmbientLight(0xffffff,.5));
const dl=new THREE.DirectionalLight(0xffffff,.8); dl.position.set(10,20,10); scene.add(dl);
fetch('building_mesh.ply').then(r=>r.text()).then(t=>{
  const l=t.trim().split('
');let vc=0,fc=0,vs=0;
  for(let i=0;i<l.length;i++){if(l[i].startsWith('element vertex'))vc=+l[i].split(' ')[2];if(l[i].startsWith('element face'))fc=+l[i].split(' ')[2];if(l[i]==='end_header'){vs=i+1;break;}}
  const g=new THREE.BufferGeometry();const v=new Float32Array(vc*3);
  for(let i=0;i<vc;i++){const p=l[vs+i].split(' ').map(Number);v[i*3]=p[0];v[i*3+1]=p[2];v[i*3+2]=p[1];}
  g.setAttribute('position',new THREE.BufferAttribute(v,3));
  const idx=[];for(let i=0;i<fc;i++){const p=l[vs+vc+i].split(' ').map(Number);idx.push(p[1],p[2],p[3]);}
  g.setIndex(idx);g.computeVertexNormals();
  const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0xcc4444,side:THREE.DoubleSide}));
  scene.add(m);
  const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(v,3));
  scene.add(new THREE.Points(pg,new THREE.PointsMaterial({color:0xffff00,size:0.12})));
  const b=new THREE.Box3().setFromObject(m),c=b.getCenter(new THREE.Vector3()),s=b.getSize(new THREE.Vector3());
  cam.position.set(c.x+s.x,c.y+s.y*1.2,c.z+s.z*1.2);ctrl.target.copy(c);ctrl.update();
});
function a(){requestAnimationFrame(a);ctrl.update();ren.render(scene,cam);}a();
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight);});
</script></body></html>
