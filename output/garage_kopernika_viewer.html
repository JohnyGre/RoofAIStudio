<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Garáž Koperníka 7004/38</title>
<style>
body { margin:0; background:#111; color:#eee; font-family:sans-serif; }
#info { position:absolute; top:16px; left:16px; background:rgba(0,0,0,.85); padding:14px; border-radius:8px; max-width:300px; }
h1 { margin:0 0 8px; font-size:15px; }

</style></head><body>
<div id="info">
  <h1>Garáž — Mikuláša Koperníka 7004/38, Trnava</h1>
  <div class="s"><div class="sl">GPS</div><div class="sv">48.393395N, 17.589217E</div></div>
  <div class="s"><div class="sl">Pôdorys</div><div class="sv">29.8 x 29.8 m</div></div>
  <div class="s"><div class="sl">Výška</div><div class="sv">12.5 m nad terénom</div></div>
  <div class="s"><div class="sl">Plocha</div><div class="sv">348 m2</div></div>
  <div class="s"><div class="sl">Stav</div><div class="sv">Plochá strecha</div></div>
  <div class="s"><div class="sl">LiDAR bodov</div><div class="sv">23,936</div></div>
  <p style="font-size:10px;color:#555;margin-top:8px">ZBGIS LLS 2022-11-11 | class=6 (budovy)</p>
</div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';
const S=new THREE.Scene();S.background=new THREE.Color(0x111122);
const C=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,1000);
const R=new THREE.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);document.body.appendChild(R.domElement);
const O=new OrbitControls(C,R.domElement);O.enableDamping=true;
S.add(new THREE.GridHelper(40,20,0x333355,0x222244));
const G=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshStandardMaterial({color:0x222233}));
G.rotation.x=-Math.PI/2;G.position.y=-0.01;S.add(G);
S.add(new THREE.AmbientLight(0xffffff,.5));
const D=new THREE.DirectionalLight(0xffffff,.8);D.position.set(10,20,10);S.add(D);
fetch('garage_kopernika.ply').then(r=>r.text()).then(t=>{
  const l=t.trim().split('
');let vc=0,fc=0,vs=0;
  for(let i=0;i<l.length;i++){if(l[i].includes('element vertex'))vc=+l[i].split(' ')[2];if(l[i].includes('element face'))fc=+l[i].split(' ')[2];if(l[i]==='end_header'){vs=i+1;break;}}
  const g=new THREE.BufferGeometry();const v=new Float32Array(vc*3);
  for(let i=0;i<vc;i++){const p=l[vs+i].split(' ').map(Number);v[i*3]=p[0];v[i*3+1]=p[2];v[i*3+2]=p[1];}
  g.setAttribute('position',new THREE.BufferAttribute(v,3));
  const idx=[];for(let i=0;i<fc;i++){const p=l[vs+vc+i].split(' ').map(Number);idx.push(p[1],p[2],p[3]);}
  g.setIndex(idx);g.computeVertexNormals();
  const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0xbb6633,side:THREE.DoubleSide}));
  S.add(m);
  const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(v,3));
  S.add(new THREE.Points(pg,new THREE.PointsMaterial({color:0x00ff00,size:0.10})));
  const b=new THREE.Box3().setFromObject(m);
  C.position.set(b.max.x+b.getSize(new THREE.Vector3()).x,b.max.y+b.getSize(new THREE.Vector3()).y,b.max.z+b.getSize(new THREE.Vector3()).z);
  O.target.copy(b.getCenter(new THREE.Vector3()));O.update();
});
(function a(){requestAnimationFrame(a);O.update();R.render(S,C);})();
addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});
</script></body></html>
